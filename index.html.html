<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Banquete de Njord - Ragnarök</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=MedievalSharp&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Cinzel", Georgia, serif;
    color: #f7e7bd;
    background: #09080b url('img-fundo.png') no-repeat center center fixed;
    background-size: cover;
    position: relative;
    overflow: hidden;
  }

  /* Overlay para suavizar e dar contraste na interface */
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0, 0, 0, 0.45) 0%, rgba(5, 5, 10, 0.8) 100%);
    pointer-events: none;
    z-index: 1;
  }

  .container {
    position: relative;
    z-index: 2;
    width: min(560px, 92vw);
    padding: 35px 28px;
    background: linear-gradient(180deg, rgba(20, 15, 25, 0.88) 0%, rgba(10, 8, 14, 0.94) 100%);
    border: 3px solid #d49a3a;
    border-radius: 16px;
    box-shadow: 
      0 0 0 4px rgba(25, 15, 8, 0.8),
      0 20px 50px rgba(0, 0, 0, 0.85),
      inset 0 0 30px rgba(212, 154, 58, 0.15);
    text-align: center;
    backdrop-filter: blur(4px);
  }

  .header-tag {
    font-size: 12px;
    letter-spacing: 4px;
    color: #cbb382;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .title {
    font-size: clamp(26px, 5vw, 42px);
    font-weight: 900;
    margin: 0 0 20px;
    color: #fff2d1;
    text-shadow: 0 3px 0 #3b1b08, 0 0 20px rgba(212, 154, 58, 0.6);
  }

  .runes {
    color: #d49a3a;
    font-size: 18px;
    letter-spacing: 12px;
    margin-bottom: 25px;
    opacity: 0.85;
  }

  .main-btn {
    width: 100%;
    padding: 18px 24px;
    font-family: "Cinzel", Georgia, serif;
    font-weight: 800;
    font-size: clamp(16px, 3.5vw, 22px);
    color: #fff8e7;
    background: linear-gradient(180deg, #8a531e 0%, #4a230d 100%);
    border: 2px solid #f3c26b;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, 0.2),
      0 6px 0 #1f0b04,
      0 10px 20px rgba(0, 0, 0, 0.5);
    transition: all 0.15s ease;
  }

  .main-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, 0.3),
      0 8px 0 #1f0b04,
      0 12px 25px rgba(243, 194, 107, 0.3);
  }

  .main-btn:active {
    transform: translateY(4px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.2),
      0 2px 0 #1f0b04;
  }

  .timer-box {
    margin: 28px auto 18px;
    padding: 18px;
    background: rgba(5, 7, 12, 0.8);
    border: 1px solid #735323;
    border-radius: 12px;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
  }

  #display {
    font-family: "MedievalSharp", Georgia, serif;
    font-size: clamp(60px, 12vw, 90px);
    color: #ffeaae;
    line-height: 1;
    text-shadow: 0 0 15px rgba(243, 194, 107, 0.4);
  }

  #status {
    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 1.5px;
    color: #c5b28d;
    min-height: 18px;
  }

  .creator {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #a8946e;
  }

  .creator strong { color: #f3c26b; }

  .creator a {
    color: #f3c26b;
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid #735323;
    border-radius: 6px;
    background: rgba(40, 22, 10, 0.6);
    transition: 0.2s;
  }

  .creator a:hover {
    background: rgba(90, 50, 20, 0.8);
    color: #fff;
  }

  /* Pop-up de alerta ao fim do tempo */
  .alert-modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    z-index: 10;
    width: min(450px, 85vw);
    padding: 30px 20px;
    background: rgba(15, 10, 7, 0.96);
    border: 3px solid #f3c26b;
    border-radius: 14px;
    box-shadow: 0 0 60px rgba(243, 194, 107, 0.4), 0 0 0 1000px rgba(0,0,0,0.6);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
  }

  .alert-modal.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .alert-modal h2 {
    margin: 0 0 10px;
    font-size: 24px;
    color: #f3c26b;
  }

  .alert-modal p {
    margin: 0 0 20px;
    font-size: 14px;
    color: #d1c1a5;
  }

  .close-btn {
    padding: 8px 24px;
    font-family: inherit;
    font-weight: bold;
    color: #fff;
    background: #50270d;
    border: 1px solid #f3c26b;
    border-radius: 6px;
    cursor: pointer;
  }

  .close-btn:hover {
    background: #733913;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header-tag">Ragnarök Online • Midgard</div>
  <h1 class="title">BANQUETE DE NJORD</h1>

  <button class="main-btn" id="startBtn">🍖 INICIAR BANQUETE 🍺</button>

  <div class="timer-box">
    <div id="display">02:30</div>
    <div id="status">Clique no botão para iniciar o tempo</div>
  </div>

  <div class="creator">
    <span>⚔ Feito por <strong>Vitiello na Voz</strong></span>
    <a href="https://linktr.ee/vitiellolucas" target="_blank" rel="noopener noreferrer">🔗 Linktree</a>
  </div>
</div>

<div class="alert-modal" id="alertModal">
  <h2>🔔 O TEMPO ACABOU! 🔔</h2>
  <p>O Banquete de Njord foi encerrado!</p>
  <button class="close-btn" id="closeBtn">FECHAR</button>
</div>

<script>
  const TOTAL_SECONDS = 150; // 2 minutos e 30 segundos
  let remainingTime = TOTAL_SECONDS;
  let timerInterval = null;
  let audioCtx = null;

  const display = document.getElementById("display");
  const status = document.getElementById("status");
  const startBtn = document.getElementById("startBtn");
  const alertModal = document.getElementById("alertModal");
  const closeBtn = document.getElementById("closeBtn");

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, "0");
    const s = (seconds % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playBeep(time, freq, duration) {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, time);

    gain.gain.setValueAtTime(0.2, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(time);
    osc.stop(time + duration);
  }

  function playAlarm() {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    // Toca uma sequência sonora chamativa de banquete/sino
    for (let i = 0; i < 6; i++) {
      const t = now + i * 0.35;
      playBeep(t, i % 2 === 0 ? 784 : 523, 0.25); // Notas Sol e Dó
    }
  }

  function finishTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    display.textContent = "00:00";
    status.textContent = "O banquete terminou!";
    startBtn.textContent = "🔄 RECOMEÇAR BANQUETE";
    alertModal.classList.add("show");
    playAlarm();
  }

  function startTimer() {
    getAudioContext(); // Ativa o áudio no clique do usuário

    if (timerInterval) {
      clearInterval(timerInterval);
    }

    remainingTime = TOTAL_SECONDS;
    display.textContent = formatTime(remainingTime);
    status.textContent = "O banquete começou! Aproveite...";
    startBtn.textContent = "⏳ BANQUETE EM ANDAMENTO";

    timerInterval = setInterval(() => {
      remainingTime--;
      display.textContent = formatTime(remainingTime);

      if (remainingTime <= 10 && remainingTime > 0) {
        status.textContent = `⚠️ Faltam ${remainingTime} segundos!`;
      }

      if (remainingTime <= 0) {
        finishTimer();
      }
    }, 1000);
  }

  startBtn.addEventListener("click", startTimer);
  closeBtn.addEventListener("click", () => {
    alertModal.classList.remove("show");
  });
</script>
</body>
</html>
